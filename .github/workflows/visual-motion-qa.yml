name: visual-motion-qa

on:
  push:
    branches:
      - breathe-desktop-rework

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm install --no-save playwright-core
      - run: npm run build
      - name: install chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
      - name: serve built site
        run: |
          npx http-server ./dist -p 4173 >/tmp/site.log 2>&1 &
          sleep 3
      - name: make capture script
        run: |
          cat > capture.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          const executablePath = fs.existsSync('/usr/bin/chromium-browser') ? '/usr/bin/chromium-browser' : '/usr/bin/chromium';
          const browser = await chromium.launch({ headless: true, executablePath, args: ['--no-sandbox'] });
          async function shot(name, dark, viewport, t) {
            const page = await browser.newPage({ viewport, colorScheme: dark ? 'dark' : 'light' });
            await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' });
            await page.waitForTimeout(1600);
            await page.evaluate((time) => {
              window.__portfolioSky?.step?.(time);
              window.__portfolioLife?.step?.(time);
            }, t);
            await page.waitForTimeout(120);
            const state = await page.evaluate(() => ({
              base: window.__portfolioSky?.state?.(),
              life: window.__portfolioLife?.state?.()
            }));
            console.log(name, JSON.stringify(state));
            await page.screenshot({ path: name, fullPage: true });
            await page.close();
          }
          await shot('qa-dark-early.png', true, { width: 1440, height: 900 }, 1000);
          await shot('qa-dark-later.png', true, { width: 1440, height: 900 }, 46000);
          await shot('qa-light-early.png', false, { width: 1440, height: 900 }, 1000);
          await shot('qa-light-later.png', false, { width: 1440, height: 900 }, 46000);
          await shot('qa-phone-light.png', false, { width: 390, height: 844 }, 46000);
          await browser.close();
          NODE
      - name: capture
        run: node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: visual-motion-qa
          path: |
            qa-dark-early.png
            qa-dark-later.png
            qa-light-early.png
            qa-light-later.png
            qa-phone-light.png
