name: visual-motion-qa

on:
  push:
    branches:
      - breathe-desktop-rework

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm install --no-save playwright-core
      - run: npm run build
      - name: install chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
      - name: serve
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/site.log 2>&1 &
          sleep 3
      - name: capture
        run: |
          cat > capture.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          const executablePath = fs.existsSync('/usr/bin/chromium-browser') ? '/usr/bin/chromium-browser' : '/usr/bin/chromium';
          const browser = await chromium.launch({ headless: true, executablePath, args: ['--no-sandbox'] });
          async function shot(name, dark, viewport, time) {
            const page = await browser.newPage({ viewport, colorScheme: dark ? 'dark' : 'light', reducedMotion: 'reduce' });
            await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' });
            await page.waitForTimeout(1400);
            await page.evaluate((t) => window.__portfolioLife?.step?.(t), time);
            await page.waitForTimeout(100);
            console.log(name, await page.evaluate(() => ({base:window.__portfolioSky?.state?.(),life:window.__portfolioLife?.state?.()})));
            await page.screenshot({ path: name, fullPage: false });
            await page.close();
          }
          await shot('light-0.png', false, {width:1440,height:900}, 0);
          await shot('light-1s.png', false, {width:1440,height:900}, 1000);
          await shot('light-2s.png', false, {width:1440,height:900}, 2000);
          await shot('dark-1s.png', true, {width:1440,height:900}, 1000);
          await shot('phone-light-1s.png', false, {width:390,height:844}, 1000);
          await browser.close();
          NODE
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: visual-motion-qa
          path: |
            light-0.png
            light-1s.png
            light-2s.png
            dark-1s.png
            phone-light-1s.png
