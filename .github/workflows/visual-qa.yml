name: visual-qa

on:
  push:
    branches:
      - breathe-desktop-rework

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: install chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: serve built site
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/portfolio-server.log 2>&1 &
          echo $! > /tmp/portfolio-server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
      - name: capture desktop dark
        run: npx --yes playwright@1.55.0 screenshot --browser chromium --color-scheme dark --viewport-size "1440,900" --wait-for-timeout 2500 http://127.0.0.1:4173/ qa-desktop-dark.png
      - name: capture desktop light
        run: npx --yes playwright@1.55.0 screenshot --browser chromium --color-scheme light --viewport-size "1440,900" --wait-for-timeout 2500 http://127.0.0.1:4173/ qa-desktop-light.png
      - name: capture phone dark
        run: npx --yes playwright@1.55.0 screenshot --browser chromium --color-scheme dark --viewport-size "390,844" --wait-for-timeout 2500 http://127.0.0.1:4173/ qa-phone-dark.png
      - name: capture phone light
        run: npx --yes playwright@1.55.0 screenshot --browser chromium --color-scheme light --viewport-size "390,844" --wait-for-timeout 2500 http://127.0.0.1:4173/ qa-phone-light.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-qa
          path: |
            qa-*.png
            public/assets/annapurna-circuit.jpg
            /tmp/portfolio-server.log
          if-no-files-found: warn
