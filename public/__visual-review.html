<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Branch layout review</title><style>body{margin:16px;background:#bbb;font:14px Arial}nav{display:flex;gap:10px;margin-bottom:12px}iframe{border:0;display:block;background:#eee9df}button,select{padding:8px}</style><nav><label>Width <select id="width"><option>390</option><option>360</option><option>430</option><option>768</option><option>1280</option></select></label><label>Page <select id="page"><option value="/">home</option><option value="/#work">work</option><option value="/#projects">projects</option><option value="/writing/">writing</option><option value="/writing/mental-reset/">article</option></select></label><button data-sky="noon">Day</button><button data-sky="night">Night</button><button data-sky="dusk">Dusk</button><button data-date="2026-09-11T15:00:00Z">New moon</button><button data-date="2026-09-18T15:00:00Z">Quarter moon</button><button data-date="2026-09-26T19:00:00Z">Full moon</button><button data-date="2026-09-07T04:00:00Z">Morning</button><button data-date="2026-09-07T01:00:00Z">Sunrise</button><button data-date="2026-09-07T12:00:00Z">Sunset</button></nav><iframe title="Responsive site preview" width="390" height="844"></iframe><script>const frame=document.querySelector('iframe');async function load(){let path=document.querySelector('#page').value;let html=await(await fetch(path.split('#')[0])).text();frame.srcdoc=html.replace('<head>','<head><base href="/">');frame.onload=()=>{if(path.includes('#'))frame.contentDocument.getElementById(path.split('#')[1])?.scrollIntoView();};}document.querySelector('#width').onchange=e=>frame.width=e.target.value;document.querySelector('#page').onchange=load;document.querySelectorAll('[data-sky]').forEach(b=>b.onclick=()=>{for(const key of b.dataset.sky)frame.contentDocument.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true}));});document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>frame.contentWindow.__portfolioSky.stepClock(new Date(b.dataset.date)));load();</script></html>
